[build-system]
requires = ["setuptools>=77"]  # SPDX licence expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "cryo-savanna"
dynamic = ["version"]  # cryo_savanna/_version.py, written at each commit by tools/hooks/set_version.sh
description = "An alternative GUI for RELION 5.1 projects (SPA and tomography), not made by the RELION developers"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Adrián González-López" }]
keywords = ["cryo-EM", "RELION", "GUI", "single particle analysis", "cryo-ET", "tomography"]
classifiers = [  # the licence is given by `license` above (PEP 639), not by a classifier
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "mrcfile>=1.4",
]

[project.optional-dependencies]
gui = ["qtpy>=2.4", "PySide6>=6.5", "pyqtgraph>=0.13", "tifffile"]
dev = ["pytest>=7", "pytest-qt>=4", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
cryo-savanna = "cryo_savanna.app:main"
savanna = "cryo_savanna.app:main"

[tool.setuptools.dynamic]
version = { attr = "cryo_savanna._version.__version__" }

[tool.setuptools.packages.find]
include = ["cryo_savanna*"]

[tool.setuptools.package-data]
"cryo_savanna.jobdefs" = ["*.json", "help/*/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["env", "build", "tools/extract_jobdefs", "tools/pipeline_ops_ref"]

[tool.ruff.lint]
# real defects, not layout: pyflakes, pycodestyle errors and warnings, bugbear
select = ["E", "F", "W", "B"]
ignore = [
    "E501",  # a line a little over 120 is left as it reads best
    "B904",  # "raise Usage(...)" in an except: the message is the whole story, no chain is shown
    "B905",  # zip() of rows and columns of different lengths is meant to stop at the shorter
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["qtpy.QtCore.QModelIndex"]  # Qt's own signature: parent=QModelIndex()

[tool.mypy]
python_version = "3.11"
files = ["cryo_savanna"]
ignore_missing_imports = true  # mrcfile, pyqtgraph, tifffile: no type information

[[tool.mypy.overrides]]
# The windows are not checked yet: Qt's enums through qtpy and the widgets made in a later step
# (self.viewer: X | None) are most of what mypy says there, not defects.
module = ["cryo_savanna.ui.*", "cryo_savanna.viewers.*"]
ignore_errors = true

