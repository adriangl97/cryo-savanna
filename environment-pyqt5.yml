# For login nodes whose glibc is older than 2.28 (PySide6 wheels need 2.28): the same environment
# with Qt 5 through PyQt5. cryo-savanna talks to Qt only through qtpy, so nothing else changes.
# Not tested as thoroughly as the PySide6 environment. Installs the same way:
#   mamba env create -f environment-pyqt5.yml [-p /opt/cryo-savanna-qt5]
name: cryo-savanna-qt5
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - numpy>=1.24
  - mrcfile>=1.4
  - tifffile
  - qtpy>=2.4
  - pyqt>=5.15,<6
  - pyqtgraph>=0.13
  - pytest>=7
  - pytest-qt>=4
  - pip
  - pip:
      - .  # cryo-savanna itself: the cryo-savanna and savanna commands
